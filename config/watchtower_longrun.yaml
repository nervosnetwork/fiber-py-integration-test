# Watchtower long-run (testnet) config. See docs/watchtower_longrun/README.md
# Builder (CI trigger) reads everything except `verifier:`; the verifier reads `verifier:`.
scenarios_per_day: 1            # how many scenarios the daily trigger builds
deadline_hours: 30              # verifier marks unresolved cases FAIL after this (WTL-08), preimage-only scenarios
timeout_deadline_hours: 384     # 16d: scenarios with timeout TLCs. fnn adds a random +N*4h privacy delta (4h..14d,
                                # tlc_expiry_limit default) to every TLC expiry, so timeout claims may land ~14d late
send_mode: sequential          # sequential | concurrent; concurrent hit fnn "revocation nonce ledger has been unbalanced" on devnet
payment_timeout_seconds: 300    # per payment (sequential) / whole batch
scenario:
  normal_payments: {count: 2, amount_ckb: 1}   # settled off-chain before the close
  preimage_tlcs:   {count: 2, amount_ckb: 1}   # hold invoice, settled after the close -> on-chain preimage claim
  timeout_tlcs:    {count: 2, amount_ckb: 1}   # hold invoice never settled -> on-chain timeout claim
  final_tlc_expiry_delta_ms: null              # null = invoice default (24h on fnn release)
tlc_expiry_delta_ms: null       # used only when the builder has to open a replacement channel
force_close:
  strategy: round_robin         # round_robin | fixed | random
  fixed_index: 0
  spare_parallel: 1             # extra Ready channel kept on every closed pair (WTL-07/13)
  reopen_capacity_ckb: 1000     # capacity for channels the builder opens to refill a pair
  # each entry is one scenario's close set; refs must be controlled-controlled hops
  close_sets:
    # with the 3-controlled testnet layout C-C-P-P-C only N1-N2 can be closed:
    - [[N1, N2, {parallel: 2}]]                 # covers 01-06,13 (12 = N/A)
    # with 4 controlled nodes (C-C-P-C-C) this also covers WTL-12:
    # - [[N1, N2], [N4, N5, {parallel: 2}]]
post_check_amount_ckb: 1
# liquidity upkeep (builder). Sends are sequential.
rebalance:
  enabled: true
  target_ratio: 0.3             # rebalance when a route hop's best upstream (payer-side) share drops below this
  amount_ckb: 100               # one keysend receiver(N5) -> payer(N1) per step
  max_payments: 5               # per stage; stages: "pre" (before pre-check/inventory) and "post" (after the scenario)
  after_scenario: true
  post_delay_seconds: 10
  payment_timeout_seconds: 120
liquidity:
  auto_open: true               # hop upstream balance < min_upstream_ckb (or < scenario need):
  min_upstream_ckb: 50          #   controlled upstream node -> open a new channel from it;
  min_upstream_ckb_by_hop: {}   #   per-hop floor, e.g. {"N1-N2": 200}
  open_capacity_ckb: 1000       #   public upstream -> never opened; rely on rebalance, else build_failed (WTL-09)
wallet:
  min_ckb: 2000                 # pre-check: controlled node on-chain wallet below this -> build_failed (WTL-09)
limits:
  max_tlcs_per_scenario: 50
  max_scenarios_per_day: 4
verifier:
  interval_seconds: 300             # poll every 5 min (devnet e2e overrides to 3s)
  expiry_alert_margin_ms: 7200000   # alert when an unresolved timeout TLC is <2h from expiry
  max_fee_ckb_per_channel: 1
  daily_summary_hour: 9
  wallet_warn_ckb: 5000             # Discord warning (once/day/node) when a controlled wallet drops below; shown on /nodes + daily summary             # local time of the monitor host

# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: fiber testnet test

on:
  schedule:
    - cron: '0 0 */2 * *' # This triggers the workflow daily at midnight UTC
  workflow_dispatch: # Allows the workflow to be manually triggered
    inputs:
      GitUrl:
        description: 'fiber -git url'
        default: 'https://github.com/nervosnetwork/fiber.git'
      GitBranch:
        description: 'fiber -git branch'
        default: 'develop'
      BuildFIBER:
        description: 'build fiber'
        default: 'false'

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v3
    - name: Set up Python 3.12
      uses: actions/setup-python@v3
      with:
        python-version: "3.12"

    - name: Print Input Values
      run: |
        echo "**Input Values:**"
        echo "  GitUrl: ${{ github.event.inputs.GitUrl }}"
        echo "  GitBranch: ${{ github.event.inputs.GitBranch }}"
        echo "  BuildCKbCLI: ${{ github.event.inputs.BuildFIBER }}"


    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Install dependencies
      run: make prepare_develop_testnet
      env:
        GitUrl: '${{ github.event.inputs.GitUrl }}'
        GitBranch: '${{ github.event.inputs.GitBranch }}'
        BuildFIBER: '${{ github.event.inputs.BuildFIBER }}'

    - name: Run tests
      run: make fiber_testnet_test

#    - name: Setup upterm session
#      if: always()
#      uses: lhotari/action-upterm@v1

    - name: Publish reports
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: jfoa-build-reports-${{ runner.os }}
        path: ./report

  notify-discord:
    runs-on: ubuntu-22.04
    needs: build
    if: always()
    steps:
      - name: Notify Discord on success
        if: needs.build.result == 'success'
        continue-on-error: true
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          title: "Fiber Testnet Test Succeeded"
          description: "Fiber testnet test succeeded for fiber branch ${{ github.event.inputs.GitBranch || 'develop' }}. Triggered by ${{ github.actor }}. Check run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}."
          color: 0x00ff00

      - name: Notify Discord on failure
        if: needs.build.result != 'success'
        continue-on-error: true
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          content: "<@802020984097734656>"
          title: "Fiber Testnet Test Failed"
          description: "Fiber testnet test finished with ${{ needs.build.result }} for fiber branch ${{ github.event.inputs.GitBranch || 'develop' }}. Check run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}."
          color: 0xff0000

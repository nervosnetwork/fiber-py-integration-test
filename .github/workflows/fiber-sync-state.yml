# Daily mainnet + testnet graph sync measurement.
# Mirrors fiber-testnet.yml setup; posts RESULT lines to Discord after the run.

name: fiber sync state

on:
  schedule:
    # Daily at 00:00 UTC
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      GitUrl:
        description: "fiber -git url"
        default: "https://github.com/nervosnetwork/fiber.git"
      GitBranch:
        description: "fiber -git branch"
        default: "develop"
      BuildFIBER:
        description: "build fiber"
        default: "false"
      SampleSeconds:
        description: "poll interval seconds (FIBER_SYNC_STATE_SAMPLE_SECONDS)"
        default: "5"
      StableSeconds:
        description: "stable window seconds (FIBER_SYNC_STATE_STABLE_SECONDS)"
        default: "60"
      MaxSeconds:
        description: "max duration seconds (FIBER_SYNC_STATE_MAX_SECONDS)"
        default: "7200"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    # setup + up to 2h sync observation
    timeout-minutes: 180
    outputs:
      sync_results: ${{ steps.capture.outputs.sync_results }}

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python 3.12
        uses: actions/setup-python@v3
        with:
          python-version: "3.12"

      - name: Print Input Values
        run: |
          echo "**Input Values:**"
          echo "  GitUrl: ${{ github.event.inputs.GitUrl }}"
          echo "  GitBranch: ${{ github.event.inputs.GitBranch }}"
          echo "  BuildFIBER: ${{ github.event.inputs.BuildFIBER }}"
          echo "  SampleSeconds: ${{ github.event.inputs.SampleSeconds }}"
          echo "  StableSeconds: ${{ github.event.inputs.StableSeconds }}"
          echo "  MaxSeconds: ${{ github.event.inputs.MaxSeconds }}"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Prepare fiber binaries
        run: make prepare_develop_testnet
        env:
          GitUrl: "${{ github.event.inputs.GitUrl }}"
          GitBranch: "${{ github.event.inputs.GitBranch }}"
          BuildFIBER: "${{ github.event.inputs.BuildFIBER }}"

      - name: Run sync state tests
        id: run_tests
        env:
          FIBER_SYNC_STATE_SAMPLE_SECONDS: ${{ github.event.inputs.SampleSeconds || '5' }}
          FIBER_SYNC_STATE_STABLE_SECONDS: ${{ github.event.inputs.StableSeconds || '60' }}
          FIBER_SYNC_STATE_MAX_SECONDS: ${{ github.event.inputs.MaxSeconds || '7200' }}
        run: |
          set -o pipefail
          make fiber_sync_state_test 2>&1 | tee sync_state.log

      - name: Capture RESULT lines for Discord
        id: capture
        if: always()
        run: |
          set -e
          RESULTS=""
          if [ -f report/sync_state_results.txt ]; then
            RESULTS=$(cat report/sync_state_results.txt)
          elif [ -f sync_state.log ]; then
            RESULTS=$(grep -E '\[(main|test)_net\] RESULT' sync_state.log || true)
          fi
          if [ -z "$RESULTS" ]; then
            RESULTS="No RESULT lines captured (job=${{ job.status }})"
          fi
          echo "Captured results:"
          echo "$RESULTS"
          {
            echo "sync_results<<EOF"
            printf '%s\n' "$RESULTS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "# Fiber Sync State Results" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' "$RESULTS" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Publish reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fiber-sync-state-${{ runner.os }}-${{ github.run_id }}
          path: |
            report/
            sync_state.log
          if-no-files-found: ignore

  notify-discord:
    runs-on: ubuntu-22.04
    needs: build
    if: always()
    steps:
      - name: Notify Discord on success
        if: needs.build.result == 'success'
        continue-on-error: true
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_SYNC }}
          title: "Fiber Sync State Succeeded"
          description: |
            Daily mainnet/testnet graph sync finished for fiber branch `${{ github.event.inputs.GitBranch || 'develop' }}`.
            Triggered by `${{ github.actor }}`.

            ```
            ${{ needs.build.outputs.sync_results }}
            ```

            Check run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          color: 0x00ff00

      - name: Notify Discord on failure
        if: needs.build.result != 'success'
        continue-on-error: true
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_SYNC_SYNC }}
          content: "<@802020984097734656>"
          title: "Fiber Sync State Failed"
          description: |
            Fiber sync state finished with **${{ needs.build.result }}** for fiber branch `${{ github.event.inputs.GitBranch || 'develop' }}`.

            ```
            ${{ needs.build.outputs.sync_results }}
            ```

            Check run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          color: 0xff0000
